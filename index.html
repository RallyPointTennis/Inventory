<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rally Point — Stock</title><style>*{box-sizing:border-box}body{margin:0;font:11pt Arial,Helvetica,sans-serif;color:#1F2937;background:#fff}header{background:#13294B;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:2}header .t{font-size:16pt;font-weight:bold}header .s{font-size:9pt;color:#C7D2E4;margin-top:2px}#q{display:block;width:calc(100% - 28px);margin:10px 14px;padding:9px 11px;border:1px solid #E6E9EE;border-radius:6px;background:#F2F5FA;color:#1F2937;font-size:11pt;font-family:inherit}h2{margin:16px 14px 6px;font-size:11pt;color:#13294B;border-bottom:1px solid #E6E9EE;padding-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}h2 span{font-size:9pt;color:#8A9099;font-weight:normal}.p{padding:9px 14px;border-bottom:1px solid #E6E9EE}.p.hide{display:none}.nm{font-weight:bold;font-size:11pt}.sub{font-size:9pt;color:#8A9099;margin:1px 0 6px}.run{display:flex;gap:3px}.run i{flex:1;text-align:center;font-style:normal;border-radius:4px;padding:3px 0;min-width:0}.run i b{display:block;font-size:7.5pt;font-weight:normal;color:#8A9099}.run i u{display:block;text-decoration:none;font-size:10pt;font-weight:bold;line-height:1.15}.run i.y{background:#F2F5FA}.run i.y u{color:#13294B}.run i.z{background:#FDECEC}.run i.z u,.run i.z b{color:#B3261E}.run i.n u,.run i.n b{color:#D8DDE5}.one{font-size:14pt;font-weight:bold;color:#13294B}.one.z{color:#B3261E}#msg{margin:14px;padding:12px 14px;border-radius:8px;background:#F2F5FA;font-size:10pt;line-height:1.45;white-space:pre-wrap}#msg.bad{background:#FDECEC;color:#8A1C1C}.foot{color:#8A9099;font-size:9pt;margin:16px 14px 28px}</style></head><body><header><div class="t">Rally Point — Stock</div><div class="s">what is on the shelf right now</div></header><input id="q" placeholder="Search a product, or a size…" autocomplete="off"><div id="msg">Loading…</div><div id="body"></div><div class="foot" id="foot"></div><script>var door="https://script.google.com/macros/s/AKfycbyTLvTmuID3dqAxV9UYxZfcSYouqzhaff2qSzgVutv4CRw1WMWiuvVW26rLcAjFfQyB/exec?api=stock";var msg=document.getElementById("msg"),body=document.getElementById("body"),foot=document.getElementById("foot");function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c];});}function draw(d,road){if(!d||!d.ok){msg.className="bad";msg.textContent="The stock list answered ("+road+") but said: "+((d&&d.error)||"nothing");return;}msg.style.display="none";var h="";for(var i=0;i<d.sections.length;i++){var s=d.sections[i];h+='<h2>'+esc(s.name)+'<span>'+s.products.length+" styles · "+s.have+" in stock"+(s.soldOut?" · "+s.soldOut+" sold out":"")+"</span></h2>";for(var j=0;j<s.products.length;j++){var p=s.products[j];h+='<div class="p" data-f="'+esc((s.name+" "+p.name).toLowerCase())+'"><div class="nm">'+esc(p.name)+"</div>";if(s.plain){var v=p.q[0];h+='<div class="one'+(v===0?" z":"")+'">'+(v===null?"—":v)+"</div>";}else{h+='<div class="run">';for(var k=0;k<s.counts.length;k++){var n=p.q[k];var cl=(n===null?"n":(n===0?"z":"y"));h+='<i class="'+cl+'"><b>'+esc(s.counts[k])+"</b><u>"+(n===null?"&nbsp;":n)+"</u></i>";}h+="</div>";}h+="</div>";}}body.innerHTML=h;foot.textContent="Counted stock, straight from the workbook. Read only — nothing here changes anything. "+"Updated "+d.when+" · build "+d.build+" · reached the list by the "+road+".";}document.getElementById("q").addEventListener("input",function(){var t=this.value.toLowerCase().split(/\s+/).filter(Boolean);var rows=body.getElementsByClassName("p");for(var i=0;i<rows.length;i++){var f=rows[i].getAttribute("data-f"),ok=true;for(var j=0;j<t.length;j++){if(f.indexOf(t[j])<0){ok=false;break;}}rows[i].className=ok?"p":"p hide";}});function road2(err1){var s=document.createElement("script"),done=false;window.rpStock=function(d){done=true;draw(d,"second road");};s.src=door+"&callback=rpStock&t="+Date.now();s.onerror=function(){if(!done){done=true;msg.className="bad";msg.textContent="Could not reach the stock list either way.\nFirst road: "+err1+"\nSecond road: the script would not load.\n\nPhone: "+navigator.userAgent;}};setTimeout(function(){if(!done){done=true;msg.className="bad";msg.textContent="Could not reach the stock list either way.\nFirst road: "+err1+"\nSecond road: no answer in 10 seconds.\n\nPhone: "+navigator.userAgent;}},10000);document.body.appendChild(s);}fetch(door,{redirect:"follow"}).then(function(r){return r.json();}).then(function(d){draw(d,"first road");}).catch(function(e){msg.textContent="First road blocked ("+e+"). Trying the second…";road2(String(e));});</script></body></html>
