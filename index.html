hone: "+navigator.userAgent;}};setTimeout(function(){if(!done){done=true;msg.className="bad";msg.textContent="Could not reach the stock list either way.\nFirst road: "+err1+"\nSecond road: no answer in 10 seconds.\n\nPhone: "+navigator.userAgent;}},10000);document.body.appendChild(s);}if(!pk){msg.className="bad";msg.textContent="This page needs its link. Open it from the link in the workbook (Manual tab, or ask Jenna) — not by typing the address.";}else{fetch(door,{redirect:"follow"}).then(function(r){return r.json();}).then(function(d){draw(d,"first road");}).catch(function(e){msg.textContent="First road blocked ("+e+"). Trying the second…";road2(String(e));});}</script></body></html>
